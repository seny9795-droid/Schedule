<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이 위시리스트 & 스마트 쇼핑 매니저</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Pretendard -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        body { font-family: 'Pretendard', sans-serif; word-break: keep-all; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-14 sm:h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white shadow-md shadow-rose-500/20">
                    <i class="fa-solid fa-gift text-sm sm:text-lg"></i>
                </div>
                <div>
                    <h1 class="text-sm sm:text-xl font-bold bg-gradient-to-r from-rose-600 to-pink-600 bg-clip-text text-transparent">WishKeeper</h1>
                </div>
            </div>
            <!-- Action Buttons -->
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button onclick="exportData()" class="px-2 py-1.5 sm:px-3 sm:py-2 border border-slate-300 text-[11px] sm:text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition shadow-xs" title="백업">
                    <i class="fa-solid fa-download sm:mr-1 text-slate-500"></i><span class="hidden sm:inline"> 백업</span>
                </button>
                <label class="px-2 py-1.5 sm:px-3 sm:py-2 border border-slate-300 text-[11px] sm:text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition shadow-xs cursor-pointer" title="불러오기">
                    <i class="fa-solid fa-upload sm:mr-1 text-slate-500"></i><span class="hidden sm:inline"> 불러오기</span>
                    <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                </label>
                <button onclick="openCategoryModal()" class="px-2.5 py-1.5 sm:px-3.5 sm:py-2 border border-slate-300 text-[11px] sm:text-sm font-medium rounded-lg text-slate-700 bg-white hover:bg-slate-50 transition shadow-xs">
                    <i class="fa-solid fa-folder-gear sm:mr-1.5 text-slate-500"></i><span class="hidden sm:inline"> 카테고리</span>
                </button>
                <button onclick="openAddModal()" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-rose-600 border border-transparent rounded-lg font-medium text-[11px] sm:text-sm text-white hover:bg-rose-700 transition shadow-sm shadow-rose-600/30">
                    <i class="fa-solid fa-plus sm:mr-1"></i> 등록
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-8 flex-1 w-full">
        
        <!-- Dashboard Summary & Tab Navigation -->
        <div class="flex flex-col gap-3 mb-5 sm:mb-8">
            <!-- Tabs -->
            <div class="flex space-x-2 w-full">
                <button id="tab-wishlist" onclick="switchTab('wishlist')" class="flex-1 py-2 font-semibold text-xs sm:text-sm rounded-lg transition bg-rose-600 text-white shadow-sm shadow-rose-600/20 text-center">
                    <i class="fa-solid fa-heart mr-1"></i>위시리스트 <span id="count-wishlist" class="ml-1 px-1.5 py-0.2 bg-rose-700 text-white text-[10px] sm:text-xs rounded-full">0</span>
                </button>
                <button id="tab-completed" onclick="switchTab('completed')" class="flex-1 py-2 font-semibold text-xs sm:text-sm rounded-lg transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 text-center">
                    <i class="fa-solid fa-check-circle mr-1"></i>구매 완료 <span id="count-completed" class="ml-1 px-1.5 py-0.2 bg-slate-200 text-slate-700 text-[10px] sm:text-xs rounded-full">0</span>
                </button>
            </div>

            <!-- Filters -->
            <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2">
                <div class="relative col-span-2 sm:col-span-1">
                    <select id="filter-category" onchange="renderItems()" class="w-full sm:w-auto appearance-none bg-white border border-slate-300 text-slate-700 text-xs sm:text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500">
                        <option value="all">모든 카테고리</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
                <div class="relative">
                    <select id="filter-need" onchange="renderItems()" class="w-full sm:w-auto appearance-none bg-white border border-slate-300 text-slate-700 text-xs sm:text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500">
                        <option value="all">모든 필요도</option>
                        <option value="상">필요도: 상</option>
                        <option value="중">필요도: 중</option>
                        <option value="하">필요도: 하</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
                <div class="relative">
                    <select id="filter-urgency" onchange="renderItems()" class="w-full sm:w-auto appearance-none bg-white border border-slate-300 text-slate-700 text-xs sm:text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-rose-500">
                        <option value="all">모든 긴급도</option>
                        <option value="상">긴급도: 상</option>
                        <option value="중">긴급도: 중</option>
                        <option value="하">긴급도: 하</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <i class="fa-solid fa-chevron-down text-xs"></i>
                    </div>
                </div>
                <button onclick="resetFilters()" class="col-span-2 sm:col-span-1 px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-medium rounded-lg transition flex items-center justify-center shadow-xs">
                    <i class="fa-solid fa-rotate-right mr-1.5 text-slate-500"></i> 필터 초기화
                </button>
            </div>
        </div>

        <!-- Items Grid Container -->
        <div id="items-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 sm:gap-6">
            <!-- Dynamic Cards -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 bg-white rounded-2xl border border-dashed border-slate-300 shadow-xs mt-4">
            <div class="w-14 h-14 bg-rose-50 rounded-full flex items-center justify-center text-rose-500 text-xl mb-3">
                <i class="fa-solid fa-basket-shopping"></i>
            </div>
            <h3 class="text-sm sm:text-base font-bold text-slate-700 mb-1">등록된 위시리스트가 없습니다</h3>
            <p class="text-slate-400 text-xs mb-5 text-center px-4">갖고 싶은 물건을 등록하고 합리적인 소비 계획을 세워보세요.</p>
            <button onclick="openAddModal()" class="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs font-medium hover:bg-rose-700 transition">
                + 첫 위시리스트 등록하기
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-5 mt-8 text-center text-[11px] sm:text-xs text-slate-400">
        <p>&copy; 2026 WishKeeper. Smart Wishlist Manager. All rights reserved.</p>
    </footer>

    <!-- ADD/EDIT MODAL -->
    <div id="item-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs hidden p-3 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl max-w-lg w-full overflow-hidden my-auto">
            <div class="px-4 py-3 sm:px-6 sm:py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <h3 id="modal-title" class="font-bold text-slate-800 text-sm sm:text-base">새 위시리스트 등록</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600 text-base p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="item-form" onsubmit="saveItem(event)" class="p-4 sm:p-6 space-y-3 max-h-[75vh] overflow-y-auto text-xs sm:text-sm">
                <input type="hidden" id="item-id">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 uppercase mb-1">상품명 *</label>
                        <input type="text" id="item-name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 uppercase mb-1">카테고리 *</label>
                        <select id="item-category" required class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-rose-500 focus:outline-none">
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 uppercase mb-1">가격 (원) *</label>
                        <input type="number" id="item-price" required placeholder="예: 45000" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 uppercase mb-1">구매처 링크 (URL)</label>
                        <input type="url" id="item-link" placeholder="https://..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-slate-600 uppercase mb-1">필요도 선택 *</label>
                        <select id="item-need" required class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-rose-500 focus:outline-none">
                            <option value="상">필요도: 상</option>
                            <option value="중">필요도: 중</option>
                            <option value="하">필요도: 하</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 uppercase mb-1">긴급도 선택 *</label>
                        <select id="item-urgency" required class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-rose-500 focus:outline-none">
                            <option value="상">긴급도: 상</option>
                            <option value="중">긴급도: 중</option>
                            <option value="하">긴급도: 하</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block font-semibold text-slate-600 uppercase mb-1">상품 사진 (이미지 URL 또는 업로드)</label>
                    <input type="text" id="item-image" placeholder="이미지 주소 입력 또는 아래 파일 선택" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none mb-1">
                    <input type="file" id="item-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full text-[11px] text-slate-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-md file:border-0 file:font-semibold file:bg-rose-50 file:text-rose-700 hover:file:bg-rose-100">
                </div>

                <div>
                    <label class="block font-semibold text-emerald-600 uppercase mb-1"><i class="fa-solid fa-circle-check mr-1"></i> 구매해야 하는 사유 (Pros)</label>
                    <textarea id="item-pro-reason" rows="2" placeholder="이 물건이 왜 나에게 꼭 필요한지 적어보세요." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block font-semibold text-rose-600 uppercase mb-1"><i class="fa-solid fa-circle-xmark mr-1"></i> 구매하지 말아야 하는 사유 (Cons)</label>
                    <textarea id="item-con-reason" rows="2" placeholder="참아야 하는 이유나 단점이 있다면 적어보세요." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none"></textarea>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-2 border-t border-slate-200">
                    <button type="button" onclick="closeAddModal()" class="px-3.5 py-1.5 border border-slate-300 text-slate-700 rounded-lg font-medium hover:bg-slate-100 transition">취소</button>
                    <button type="submit" class="px-4 py-1.5 bg-rose-600 text-white rounded-lg font-medium hover:bg-rose-700 transition shadow-sm">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CATEGORY MANAGEMENT MODAL -->
    <div id="category-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-xs hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full overflow-hidden">
            <div class="px-4 py-3 sm:px-6 sm:py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <h3 class="font-bold text-slate-800 text-sm sm:text-base">카테고리 관리</h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-slate-600 text-base">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 sm:p-6 space-y-3 text-xs sm:text-sm">
                <div class="flex space-x-2">
                    <input type="text" id="new-category-name" placeholder="새 카테고리 이름 입력" class="flex-1 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 focus:outline-none">
                    <button onclick="addCategory()" class="px-3.5 py-2 bg-slate-800 text-white font-medium rounded-lg hover:bg-slate-900 transition">추가</button>
                </div>
                <div class="border border-slate-200 rounded-lg divide-y divide-slate-200 max-h-52 overflow-y-auto" id="category-list-container">
                </div>
                <div class="text-right pt-2">
                    <button onclick="closeCategoryModal()" class="px-4 py-2 bg-rose-600 text-white font-medium rounded-lg hover:bg-rose-700 transition">확인</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic & Google Sheets Integration -->
    <script>
        // 👇 여기에 구글 Apps Script에서 발급받은 웹 앱 URL을 넣어주세요!
        const API_URL = "https://script.google.com/macros/s/AKfycbyrB7ddzikhoJWWpTz2EEWV4uXUSdBHoVRWrcORKbliBV95K2trxO_vuiMNdNRKqFM9ng/exec";

        let categories = ['의류', '악세서리', '생필품', '서비스', '전자기기', '도서/취미'];
        let items = [];
        let currentTab = 'wishlist';
        let uploadedImageBase64 = '';

        window.onload = function() {
            fetchDataFromSheet();
        };

        function fetchDataFromSheet() {
            if (!API_URL || API_URL.includes("여기에")) {
                items = [
                    { id: 1, name: '미니멀 가죽 크로스백', category: '악세서리', price: 128000, link: '', need: '상', urgency: '상', image: '', proReason: '가방 교체 필요', conReason: '유사품 있음', completed: false }
                ];
                updateCategorySelectors();
                renderItems();
                return;
            }

            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data) && data.length > 0) {
                        items = data;
                    }
                    updateCategorySelectors();
                    renderItems();
                })
                .catch(err => {
                    console.error("데이터 로드 실패:", err);
                    renderItems();
                });
        }

        function saveData() {
            if (!API_URL || API_URL.includes("여기에")) return;

            fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(items)
            }).catch(err => {
                console.error("동기화 실패:", err);
            });
        }

        function exportData() {
            const data = { categories, items };
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wishkeeper_backup_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.categories && parsed.items) {
                        categories = parsed.categories;
                        items = parsed.items;
                        saveData();
                        updateCategorySelectors();
                        renderItems();
                        alert('데이터를 성공적으로 불러왔습니다!');
                    } else {
                        alert('올바른 백업 파일 형식이 아닙니다.');
                    }
                } catch (err) {
                    alert('파일을 읽는 중 오류가 발생했습니다.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetFilters() {
            document.getElementById('filter-category').value = 'all';
            document.getElementById('filter-need').value = 'all';
            document.getElementById('filter-urgency').value = 'all';
            renderItems();
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnWishlist = document.getElementById('tab-wishlist');
            const btnCompleted = document.getElementById('tab-completed');

            if (tab === 'wishlist') {
                btnWishlist.className = "flex-1 py-2 font-semibold text-xs sm:text-sm rounded-lg transition bg-rose-600 text-white shadow-sm shadow-rose-600/20 text-center";
                btnCompleted.className = "flex-1 py-2 font-semibold text-xs sm:text-sm rounded-lg transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 text-center";
            } else {
                btnCompleted.className = "flex-1 py-2 font-semibold text-xs sm:text-sm rounded-lg transition bg-rose-600 text-white shadow-sm shadow-rose-600/20 text-center";
                btnWishlist.className = "flex-1 py-2 font-semibold text-xs sm:text-sm rounded-lg transition bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 text-center";
            }
            renderItems();
        }

        function updateCategorySelectors() {
            const filterSelect = document.getElementById('filter-category');
            const modalSelect = document.getElementById('item-category');
            if (!filterSelect || !modalSelect) return;
            
            let filterHtml = '<option value="all">모든 카테고리</option>';
            let modalHtml = '';

            categories.forEach(cat => {
                filterHtml += `<option value="${cat}">${cat}</option>`;
                modalHtml += `<option value="${cat}">${cat}</option>`;
            });

            filterSelect.innerHTML = filterHtml;
            modalSelect.innerHTML = modalHtml;
        }

        function renderItems() {
            const container = document.getElementById('items-container');
            const emptyState = document.getElementById('empty-state');
            const filterCat = document.getElementById('filter-category').value;
            const filterNeed = document.getElementById('filter-need').value;
            const filterUrg = document.getElementById('filter-urgency').value;

            const filtered = items.filter(item => {
                const matchTab = currentTab === 'completed' ? item.completed : !item.completed;
                const matchCat = filterCat === 'all' || item.category === filterCat;
                const matchNeed = filterNeed === 'all' || (item.need || '상') === filterNeed;
                const matchUrg = filterUrg === 'all' || (item.urgency || '상') === filterUrg;
                return matchTab && matchCat && matchNeed && matchUrg;
            });

            const countWishlist = items.filter(i => !i.completed).length;
            const countCompleted = items.filter(i => i.completed).length;
            document.getElementById('count-wishlist').innerText = countWishlist;
            document.getElementById('count-completed').innerText = countCompleted;

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            let html = '';

            filtered.forEach(item => {
                const defaultImg = 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80';
                const imgSrc = item.image ? item.image : defaultImg;

                html += `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs hover:shadow-md transition flex flex-col overflow-hidden group">
                    <div class="relative h-40 sm:h-48 bg-slate-100 overflow-hidden">
                        <img src="${imgSrc}" alt="${item.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='${defaultImg}'">
                        <div class="absolute top-2 left-2 sm:top-3 sm:left-3 flex flex-wrap gap-1">
                            <span class="px-2 py-0.5 text-[10px] sm:text-xs font-semibold rounded-md bg-white/90 backdrop-blur-xs text-slate-700 shadow-xs">${item.category}</span>
                            <span class="px-1.5 py-0.5 text-[10px] sm:text-xs font-semibold rounded-md bg-rose-50 text-rose-700 shadow-xs">필요:${item.need || '상'}</span>
                            <span class="px-1.5 py-0.5 text-[10px] sm:text-xs font-semibold rounded-md bg-purple-50 text-purple-700 shadow-xs">긴급:${item.urgency || '상'}</span>
                        </div>
                        <div class="absolute top-2 right-2 sm:top-3 sm:right-3">
                            <label class="flex items-center space-x-1 bg-white/90 backdrop-blur-xs px-2 py-1 rounded-md shadow-xs cursor-pointer hover:bg-white transition">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleComplete(${item.id})" class="w-3.5 h-3.5 text-rose-600 rounded border-slate-300 focus:ring-rose-500">
                                <span class="text-[10px] sm:text-xs font-bold text-slate-700">구매완료</span>
                            </label>
                        </div>
                    </div>

                    <div class="p-3.5 sm:p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between gap-2 mb-1.5">
                                <h3 class="font-bold text-slate-800 text-xs sm:text-base leading-snug">${item.name}</h3>
                                <span class="text-sm sm:text-lg font-extrabold text-rose-600 whitespace-nowrap">${Number(item.price || 0).toLocaleString()}원</span>
                            </div>

                            <div class="space-y-1.5 my-2 text-[11px] sm:text-xs">
                                ${item.proReason ? `
                                <div class="bg-emerald-50/70 border border-emerald-100 rounded-lg p-2 text-emerald-900">
                                    <div class="font-bold mb-0.5 flex items-center text-emerald-700"><i class="fa-solid fa-circle-check mr-1"></i> 구매 이유</div>
                                    <p class="text-slate-600 leading-relaxed">${item.proReason}</p>
                                </div>` : ''}
                                
                                ${item.conReason ? `
                                <div class="bg-rose-50/70 border border-rose-100 rounded-lg p-2 text-rose-900">
                                    <div class="font-bold mb-0.5 flex items-center text-rose-700"><i class="fa-solid fa-circle-xmark mr-1"></i> 참아야 하는 이유</div>
                                    <p class="text-slate-600 leading-relaxed">${item.conReason}</p>
                                </div>` : ''}
                            </div>
                        </div>

                        <div class="pt-3 border-t border-slate-100 flex items-center justify-between mt-2">
                            <div>
                                ${item.link ? `<a href="${item.link}" target="_blank" class="inline-flex items-center text-[11px] sm:text-xs font-semibold text-rose-600 hover:text-rose-700 bg-rose-50 px-2 py-1 rounded-md transition"><i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> 링크</a>` : `<span class="text-[11px] sm:text-xs text-slate-400">링크 없음</span>`}
                            </div>
                            <div class="flex items-center space-x-0.5">
                                <button onclick="openEditModal(${item.id})" class="p-1.5 sm:p-2 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100 transition" title="수정"><i class="fa-solid fa-pen text-xs"></i></button>
                                <button onclick="deleteItem(${item.id})" class="p-1.5 sm:p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-rose-50 transition" title="삭제"><i class="fa-solid fa-trash text-xs"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        }

        function toggleComplete(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveData();
                renderItems();
            }
        }

        function openAddModal() {
            document.getElementById('modal-title').innerText = '새 위시리스트 등록';
            document.getElementById('item-form').reset();
            document.getElementById('item-id').value = '';
            uploadedImageBase64 = '';
            document.getElementById('item-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modal-title').innerText = '위시리스트 수정';
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-category').value = item.category;
            document.getElementById('item-price').value = item.price;
            document.getElementById('item-link').value = item.link || '';
            document.getElementById('item-need').value = item.need || '상';
            document.getElementById('item-urgency').value = item.urgency || '상';
            document.getElementById('item-image').value = item.image || '';
            document.getElementById('item-pro-reason').value = item.proReason || '';
            document.getElementById('item-con-reason').value = item.conReason || '';
            uploadedImageBase64 = item.image || '';

            document.getElementById('item-modal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('item-modal').classList.add('hidden');
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    document.getElementById('item-image').value = uploadedImageBase64;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('item-id').value;
            const name = document.getElementById('item-name').value;
            const category = document.getElementById('item-category').value;
            const price = Number(document.getElementById('item-price').value);
            const link = document.getElementById('item-link').value;
            const need = document.getElementById('item-need').value;
            const urgency = document.getElementById('item-urgency').value;
            let image = document.getElementById('item-image').value;
            const proReason = document.getElementById('item-pro-reason').value;
            const conReason = document.getElementById('item-con-reason').value;

            if (uploadedImageBase64) {
                image = uploadedImageBase64;
            }

            if (id) {
                const item = items.find(i => i.id === Number(id));
                if (item) {
                    item.name = name;
                    item.category = category;
                    item.price = price;
                    item.link = link;
                    item.need = need;
                    item.urgency = urgency;
                    item.image = image;
                    item.proReason = proReason;
                    item.conReason = conReason;
                }
            } else {
                const newItem = {
                    id: Date.now(),
                    name,
                    category,
                    price,
                    link,
                    need,
                    urgency,
                    image,
                    proReason,
                    conReason,
                    completed: false
                };
                items.unshift(newItem);
            }

            saveData();
            renderItems();
            closeAddModal();
        }

        function deleteItem(id) {
            if (confirm('정말 이 위시리스트 항목을 삭제하시겠습니까?')) {
                items = items.filter(i => i.id !== id);
                saveData();
                renderItems();
            }
        }

        function openCategoryModal() {
            renderCategoryList();
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
            updateCategorySelectors();
            renderItems();
        }

        function renderCategoryList() {
            const container = document.getElementById('category-list-container');
            if (!container) return;
            let html = '';
            categories.forEach((cat, index) => {
                html += `
                <div class="flex items-center justify-between px-3 py-2 bg-white text-xs sm:text-sm">
                    <span class="font-medium text-slate-700">${cat}</span>
                    <div class="flex items-center space-x-1.5">
                        <button onclick="editCategory(${index})" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1 rounded hover:bg-slate-100 transition">수정</button>
                        <button onclick="deleteCategory(${index})" class="text-xs text-rose-500 hover:text-rose-700 px-2 py-1 rounded hover:bg-rose-50 transition">삭제</button>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function addCategory() {
            const input = document.getElementById('new-category-name');
            if (!input) return;
            const val = input.value.trim();
            if (!val) {
                alert('카테고리 이름을 입력해주세요.');
                return;
            }
            if (categories.includes(val)) {
                alert('이미 존재하는 카테고리입니다.');
                return;
            }
            categories.push(val);
            input.value = '';
            saveData();
            renderCategoryList();
            updateCategorySelectors();
        }

        function editCategory(index) {
            const oldName = categories[index];
            const newName = prompt('수정할 카테고리 이름을 입력하세요:', oldName);
            if (newName && newName.trim() !== '' && newName !== oldName) {
                const trimmed = newName.trim();
                if (categories.includes(trimmed)) {
                    alert('이미 존재하는 카테고리입니다.');
                    return;
                }
                items.forEach(item => {
                    if (item.category === oldName) item.category = trimmed;
                });
                categories[index] = trimmed;
                saveData();
                renderCategoryList();
                updateCategorySelectors();
                renderItems();
            }
        }

        function deleteCategory(index) {
            const target = categories[index];
            const hasItems = items.some(i => i.category === target);
            if (hasItems) {
                alert(`'${target}' 카테고리를 사용 중인 위시리스트 항목이 있어 삭제할 수 없습니다.`);
                return;
            }
            if (categories.length <= 1) {
                alert('최소 1개 이상의 카테고리가 필요합니다.');
                return;
            }
            if (confirm(`'${target}' 카테고리를 삭제하시겠습니까?`)) {
                categories.splice(index, 1);
                saveData();
                renderCategoryList();
                updateCategorySelectors();
                renderItems();
            }
        }
    </script>
</body>
</html>
